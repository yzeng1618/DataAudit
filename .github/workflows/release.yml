name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: data-audit-agent/requirements.txt
      - name: Align project version with tag
        run: ./mvnw -B -q versions:set -DnewVersion="${GITHUB_REF_NAME#v}" -DgenerateBackupPoms=false
      - name: Verify Java
        run: ./mvnw -B -Dgit.commit="${GITHUB_SHA}" verify
      - name: Verify Python
        run: |
          python -m pip install -r data-audit-agent/requirements.txt
          python -m pytest -q data-audit-agent
      - name: Assemble release assets
        run: |
          mkdir -p dist
          cp data-audit-cli/target/data-audit.jar "dist/data-audit-${GITHUB_REF_NAME}.jar"
          cp data-audit-cli/target/dataaudit-ai.jar "dist/dataaudit-ai-${GITHUB_REF_NAME}.jar"
          cp target/bom.json "dist/data-audit-${GITHUB_REF_NAME}-bom.json"
          cd dist
          sha256sum data-audit-* dataaudit-ai-* > SHA256SUMS
      - name: Push container image
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          IMAGE="ghcr.io/yzeng1618/data-audit"
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker build -t "$IMAGE:$VERSION" .
          docker push "$IMAGE:$VERSION"
          if [[ "$VERSION" != *-* ]]; then
            docker tag "$IMAGE:$VERSION" "$IMAGE:latest"
            docker push "$IMAGE:latest"
          fi
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes
