name: Bug report
description: Report a reproducible defect in data-audit
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Remove credentials, API keys, and production data before submitting.
  - type: textarea
    id: description
    attributes:
      label: Problem
      description: What happened and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Provide the smallest sanitized task and command that reproduce the problem.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: 0.1.0-SNAPSHOT or commit SHA
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform
      placeholder: Windows 11, Ubuntu 24.04, macOS 15
    validations:
      required: true
  - type: input
    id: connectors
    attributes:
      label: Connector types
      placeholder: jdbc -> iceberg
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs
      description: Remove secrets and sensitive evidence values.
