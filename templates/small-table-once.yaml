task:
  name: small_table_jdbc
  mode: post_check

boundary:
  type: job_finish
  reference: latest

source:
  type: jdbc
  url: jdbc:postgresql://localhost:5432/source_db
  username: app
  password: ${SRC_PASSWORD}
  table: public.orders
  options:
    dialect: postgres

target:
  type: jdbc
  url: jdbc:postgresql://localhost:5432/target_db
  username: app
  password: ${TGT_PASSWORD}
  table: public.orders
  options:
    dialect: postgres

object:
  key:
    - order_id
  columns:
    - order_id
    - status
    - amount
    - dt
  estimated_rows: 10000

normalize:
  decimal_scale:
    amount: 2

output:
  dir: ./reports/small_table_jdbc
