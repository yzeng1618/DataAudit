task:
  name: mysql_to_doris_orders
  description: "MySQL 同步到 Doris 后的任务后一致性校验"
  mode: post_check

boundary:
  type: job_finish
  reference: latest

source:
  type: jdbc
  url: jdbc:mysql://mysql-source.example:3306/app?connectTimeout=5000&socketTimeout=300000&tcpKeepAlive=true&useSSL=false
  username: app_read
  password: ${SRC_PASSWORD}
  query: |
    select order_id, user_id, status, amount, update_time, dt
    from orders
    where dt = '2026-03-10'
  options:
    dialect: mysql
    query_timeout_seconds: 300
    fetch_size: 2000
    progress_log_interval_rows: 5000

target:
  type: jdbc
  url: jdbc:mysql://doris-fe.example:9030/ads?connectTimeout=5000&socketTimeout=300000&tcpKeepAlive=true&useSSL=false
  username: doris_read
  password: ${TGT_PASSWORD}
  query: |
    select order_id, user_id, status, amount, update_time, dt
    from ads.orders
    where dt = '2026-03-10'
  options:
    dialect: doris
    query_timeout_seconds: 300
    fetch_size: 2000
    progress_log_interval_rows: 5000

object:
  key:
    - order_id
  columns:
    - order_id
    - user_id
    - status
    - amount
    - update_time
    - dt
  partition_by:
    - dt
  estimated_rows: 5000000

planner:
  scale_override: large

normalize:
  timezone: Asia/Shanghai
  trim_string: true
  empty_as_null: true
  decimal_scale:
    amount: 2

resources:
  max_in_memory_rows: 100000
  max_diff_samples: 200

output:
  dir: /opt/data-audit/reports/mysql_to_doris_orders
