task:
  name: postgres_to_iceberg_orders
  description: "JDBC 源表与 Iceberg 目标表的 snapshot 边界校验"
  mode: post_check

boundary:
  type: snapshot
  reference: latest

source:
  type: jdbc
  url: jdbc:postgresql://postgres-source.example:5432/app?connectTimeout=5000&socketTimeout=300000&tcpKeepAlive=true
  username: app_read
  password: ${SRC_PASSWORD}
  query: |
    select order_id, status, amount, update_time, dt
    from public.orders
    where dt = '2026-03-10'
  options:
    dialect: postgres
    query_timeout_seconds: 300
    fetch_size: 2000
    progress_log_interval_rows: 5000

target:
  type: iceberg
  catalog: prod
  catalog_type: hadoop
  warehouse: hdfs:///warehouse/iceberg
  namespace: dw
  table: orders
  snapshot_id: latest

object:
  key:
    - order_id
  columns:
    - order_id
    - status
    - amount
    - update_time
    - dt
  partition_by:
    - dt
  estimated_rows: 5000000

normalize:
  timezone: Asia/Shanghai
  trim_string: true
  empty_as_null: true
  decimal_scale:
    amount: 2

output:
  dir: /opt/data-audit/reports/postgres_to_iceberg_orders
