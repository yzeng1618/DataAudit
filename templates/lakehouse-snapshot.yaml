task:
  name: lakehouse_snapshot
  mode: post_check

boundary:
  type: snapshot
  reference: latest

source:
  type: jdbc
  url: jdbc:postgresql://localhost:5432/source_db
  username: app
  password: ${SRC_PASSWORD}
  query: |
    select order_id, amount, status, dt
    from public.orders
    where dt = '2026-03-10'
  options:
    dialect: postgres

target:
  type: iceberg
  catalog: local
  catalog_type: hadoop
  warehouse: file:///tmp/warehouse
  namespace: dw
  table: orders
  snapshot_id: latest

object:
  key:
    - order_id
  columns:
    - order_id
    - amount
    - status
    - dt
  estimated_rows: 200000000
  routing_strategy: dt

output:
  dir: ./reports/lakehouse_snapshot
